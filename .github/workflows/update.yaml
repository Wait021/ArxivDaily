name: Update

on:
  workflow_dispatch:      # 支持手动触发，方便测试
  schedule:
    - cron: "30 2 * * *"  # 每天 UTC 2:30 = 北京时间 10:30（GitHub 定时任务可能有几分钟延迟）

permissions:
  contents: write   # 允许更新 README
  issues: write     # 允许发每日 Issue

concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update papers（纯标准库，无需装依赖）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python main.py

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/daily_issue.md .github/issue_title.txt
          if git diff --cached --quiet; then
            echo "今天没有变化，跳过提交"
          else
            git commit -m "📖 Update papers $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Create daily issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "daily" --color "0E8A16" --description "每日论文推送" --force || true
          gh issue create \
            --title "$(cat .github/issue_title.txt)" \
            --body-file .github/daily_issue.md \
            --label "daily"
